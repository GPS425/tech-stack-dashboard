plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.capstone'
version = '0.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-json'
    implementation 'org.jsoup:jsoup:1.23.2'
    runtimeOnly 'com.oracle.database.jdbc:ojdbc11'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // 저장한 사람인 HTML(커밋하지 않는 폴더). IDE 작업 폴더와 상관없게 절대 경로로 넘긴다
    systemProperty 'savedHtml.dir', file('src/test/resources/saved-html').absolutePath
    // -PrequireSavedHtml: 저장한 HTML 이 없으면 건너뛰지 말고 실패
    def require = findProperty('requireSavedHtml')
    systemProperty 'savedHtml.require', (require != null && require.toString() != 'false').toString()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
