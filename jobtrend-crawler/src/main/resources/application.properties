spring.application.name=jobtrend-crawler
spring.main.web-application-type=none

# DB 비밀번호는 여기 적지 않는다. 테스트 서버 docker/capstone-db/.env 의 APP_USER_PASSWORD 를 쓴다
#  - 도커: env_file 로 환경 변수가 된다
#  - PC 에서 시험: CRAWLER_ENV_FILE 에 .env 경로를 준다 (예: file:////192.168.219.50/docker/capstone-db/.env)
spring.config.import=optional:${CRAWLER_ENV_FILE:file:.env}[.properties]
spring.datasource.url=jdbc:oracle:thin:@//${DB_HOST:192.168.219.50}:${DB_PORT:1521}/${DB_SERVICE:XEPDB1}
spring.datasource.username=${DB_USER:capstone}
spring.datasource.password=${APP_USER_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3

crawler.enabled=false
crawler.run-once=false
crawler.local-only=false
crawler.jobs=84,92,2232,87,86,101,83,82,2248,80,91,95,99,2229,103,2246,2249
crawler.raw-dir=raw
crawler.max-list-pages=0
crawler.max-details=0
crawler.raw-keep-days=7
crawler.max-consecutive-failures=10
